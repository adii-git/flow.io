name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
  migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: conduit, POSTGRES_PASSWORD: ci, POSTGRES_DB: conduit}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U conduit" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://conduit:ci@localhost:5432/conduit
      SECRET_KEY: ci-secret-ci-secret-ci-secret-ci-secret
      FERNET_KEY: VGVzdEtleUZvckNvbmR1aXRUZXN0S2V5Rm9yQ29uZHU=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt
      - name: Upgrade twice (idempotent) on real Postgres with pgvector
        working-directory: backend
        run: alembic upgrade head && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build ./frontend
